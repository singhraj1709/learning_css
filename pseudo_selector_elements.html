    <style>
      h1 {
        color: red;
        font-size: 70px;
      }
      h1:hover {

      /* p {

      p:hover {
        background-color: black;

      }
      h2:active {
        background-color: black;
        color: red;
        font-size: 70px;
      }
      input:focus {
        background-color: black;
        color: white;
        border: 10px solid red;
      }
      a:visited {
        color: green;
      }
      p::first-letter {
        color: blue;
        font-size: 40px;
      }
      p::first-line {
        color: red;
      }
      ::selection {
        color: red;
        background-color: yellow;
      }
