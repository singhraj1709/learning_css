<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .b_container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-left: 20px;
            padding-top: 100px;
        }
        .s_box{
            background-color: deeppink;
            color: white;
            border-radius: 10px;
            height: 200px;
            width: 200px;
            font-size: 20px;
            padding: 20px;
            margin: 20px;
            border: 5px solid gray;
            transition: transform 2s ease-in;
        }
        .b1:hover{
            transform: translate(225px,100px);
        }
        .b2:hover{
            transform: translateX(225px);
        }
        .b3:hover{
            transform: translateY(225px);
        }
        .b4:hover{
            transform: rotate(360deg);
            background-color: chocolate;
        }
        .b5:hover{
            transform: skewX(50deg);
        }
        .b6:hover{
            transform: scale(2);
        }
    </style>
</head>
<body>
    <!-- div.b_container>div.s_box*6 -->
    <div class="b_container">
        <div class="s_box b1">translate</div>
        <div class="s_box b2">translateX</div>
        <div class="s_box b3">translateY</div>
        <div class="s_box b4">rotate</div>
        <div class="s_box b5">skew</div>
        <div class="s_box b6">scale</div>
    </div>
</body>
</html>
